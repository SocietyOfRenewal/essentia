name: Apply founding foundations

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-founding-foundations.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply staged founding foundations'
    runs-on: ubuntu-latest
    steps:
      - name: Attach the validated repository tree
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TREE: a5c555d26a3f7e40196126307d6e95a1d510ca8b
          FINAL_MESSAGE: |-
            docs(protocol): derive Essentia from the founding science

            Define Essentia as an implementation of the Founding Book's scientific constraints. Use 𝒰 for the Essential Unit, ℛ for the Essential Settlement Receivable, and ℰ for Essent throughout the monetary architecture.
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          payload="$({
            jq -n \
              --arg message "$FINAL_MESSAGE" \
              --arg tree "$TARGET_TREE" \
              --arg parent "$GITHUB_SHA" \
              '{message: $message, tree: $tree, parents: [$parent]}'
          })"

          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/commits" \
            --data "$payload")"

          commit_sha="$(jq -er '.sha' <<<"$response")"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/refs/heads/main" \
            --data "$(jq -n --arg sha "$commit_sha" '{sha: $sha, force: false}')"
